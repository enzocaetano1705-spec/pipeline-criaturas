[project]
name = "criaturas"
version = "0.1.0"
description = "Pipeline de criaturas 3D: conceito (imagens + prompt) -> modelo cubificado com textura, ossos e animações."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "jsonschema",
]

[project.scripts]
criaturas = "criaturas.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferramenta/criaturas"]

[tool.pytest.ini_options]
testpaths = ["ferramenta/testes"]
